# DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.useSSL=true
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# bucket

gcp.storage.bucket=project_school


# Additive and idempotent schema initialization for optional per-user read receipts.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/note-reads.sql
